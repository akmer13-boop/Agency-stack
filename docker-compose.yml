services:
  agency-stack-api:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  agency-stack-telegram:
    build:
      context: .
    command: ["python", "-m", "app.telegram.bot"]
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - telegram
